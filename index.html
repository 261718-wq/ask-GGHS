<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASK GGHS | ZELKOVA</title>
<meta name="description" content="고양국제고에 대해 궁금한 점을 젤코바에 질문해 보세요.">
<style>
:root{--green:#173c32;--green2:#244f41;--sage:#718477;--pale:#c3d1c5;--cream:#f5f2e9;--ink:#20352d;--line:#dfe5dc;--muted:#7c8980}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}.top{background:var(--green);color:var(--cream);padding:22px max(22px,calc((100% - 1040px)/2)) 48px}.nav{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid #527565}.brand{font-weight:800;font-size:21px;letter-spacing:.02em}.by{font-size:12px;color:#d6e5d9;letter-spacing:.08em;font-weight:700}.intro{padding-top:28px;max-width:850px}.hello{color:var(--pale);font-size:14px;line-height:1.7;margin:0 0 14px}.intro h1{font-size:clamp(27px,5vw,43px);line-height:1.35;letter-spacing:-.045em;margin:0;font-weight:800;word-break:keep-all}
.wrap{max-width:1040px;margin:-22px auto 0;padding:0 22px 64px}.panel{background:var(--cream);border-radius:18px;padding:22px;box-shadow:0 12px 35px #10291d12}.form-title{font-size:19px;font-weight:800;margin:0 0 17px}.fields{display:grid;grid-template-columns:180px 1fr;gap:10px}.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px 14px;color:var(--ink);outline:none}.field:focus{border-color:var(--sage);box-shadow:0 0 0 3px #71847720}textarea.field{min-height:104px;resize:vertical;line-height:1.6}.submit{grid-column:2;background:var(--green);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:750;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.notice{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.6}.feedback{display:none;margin:12px 0 0;padding:11px 13px;border-radius:10px;background:#e8f0e8;color:#315e40;font-size:13px;line-height:1.5}.feedback.error{background:#f8e9e5;color:#914b3d}.feedback.show{display:block}.content{padding-top:40px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:17px}.section-head h2{font-size:23px;margin:0;letter-spacing:-.04em}.count{font-size:12px;color:var(--sage)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.chip{border:1px solid #d6ded5;background:transparent;color:#58685e;border-radius:99px;padding:8px 13px;font-size:12px;cursor:pointer}.chip.active{background:var(--green);border-color:var(--green);color:white}.list{display:grid;gap:11px}.question{background:#fff;border:1px solid #e7ebe4;border-radius:13px;padding:17px 18px;cursor:pointer}.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.category{font-size:11px;color:var(--sage);font-weight:750}.status{font-size:11px;border-radius:99px;padding:5px 9px;background:#f2eee2;color:#92743a;white-space:nowrap}.status.done{background:#e8f0e8;color:#3e7252}.question h3{font-size:16px;line-height:1.5;margin:0 0 7px;letter-spacing:-.02em}.meta{font-size:11px;color:#9aa39b}.qbody{font-size:13px;line-height:1.7;color:#58685e;white-space:pre-wrap;margin-top:9px}.answer{display:none;margin-top:14px;padding:14px;background:#f5f7f2;border-radius:10px;font-size:13px;line-height:1.7;white-space:pre-wrap}.question.open .answer{display:block}.empty{padding:34px;text-align:center;color:var(--muted);background:#fff;border-radius:13px;font-size:13px}.footer{text-align:center;color:#89968c;font-size:11px;padding:32px 0 0;letter-spacing:.04em}
.admin-link{border:0;background:transparent;color:#89968c;font-size:11px;cursor:pointer;text-decoration:underline}.admin{display:none;margin-top:34px;padding:20px;background:#e9eee7;border-radius:16px}.admin.show{display:block}.admin h2{margin:0 0 14px}.admin-row{background:#fff;border-radius:12px;padding:14px;margin:10px 0}.admin-row textarea{width:100%;min-height:80px;margin:10px 0}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.smallbtn{border:0;border-radius:8px;padding:9px 12px;background:var(--green);color:#fff;cursor:pointer}.smallbtn.secondary{background:#e7ece5;color:var(--ink)}.config{background:#fff5dd;border:1px solid #ead7a5;padding:12px;border-radius:10px;font-size:13px;line-height:1.6;margin-bottom:15px}
@media(max-width:620px){.top{padding:18px 19px 42px}.wrap{padding:0 14px 45px}.panel{padding:17px}.fields{grid-template-columns:1fr}.submit{grid-column:1}.section-head h2{font-size:20px}.question{padding:15px}}
</style>
</head>
<body>
<header class="top"><div class="nav"><div class="brand">ASK GGHS</div><div class="by">BY ZELKOVA</div></div>
<div class="intro"><p class="hello">안녕하세요! 🌲고양국제고등학교 학교 홍보 동아리 젤코바🌲입니다.</p>
<h1>고양국제고에 대해 궁금한 점이 있다면 자유롭게 질문해주세요!</h1></div></header>
<main class="wrap">
<section class="panel">
<h2 class="form-title">질문 남기기</h2>
<form id="questionForm" class="fields">
<select id="category" class="field" aria-label="질문 분야"><option>학교생활</option><option>교육과정</option><option>동아리</option><option>기숙사</option><option>입학 관련</option><option>기타</option></select>
<input id="title" class="field" maxlength="70" placeholder="질문 제목을 입력해 주세요." required>
<textarea id="body" class="field" maxlength="700" placeholder="궁금한 내용을 자유롭게 작성해 주세요." required></textarea>
<button class="submit" id="submitBtn" type="submit">질문 등록하기</button></form>
<p class="notice">질문과 답변은 공개됩니다. 개인정보(이름, 연락처, 학교·학원 계정 등)는 작성하지 말아 주세요. 등록된 질문은 젤코바 확인 후 공개됩니다.</p>
<p class="feedback" id="feedback" role="status" aria-live="polite"></p>
</section>
<section class="content"><div class="section-head"><h2>질문과 답변</h2><span class="count" id="count">불러오는 중…</span></div>
<div class="filters" id="filters">
<button class="chip active" data-filter="전체">전체</button><button class="chip" data-filter="학교생활">학교생활</button><button class="chip" data-filter="교육과정">교육과정</button><button class="chip" data-filter="동아리">동아리</button><button class="chip" data-filter="기숙사">기숙사</button><button class="chip" data-filter="입학 관련">입학 관련</button><button class="chip" data-filter="기타">기타</button></div>
<div class="list" id="questionList"><div class="empty">질문을 불러오고 있어요.</div></div></section>
<section class="admin" id="adminPanel"><h2>젤코바 관리자</h2><div id="adminContent"></div></section>
<div class="footer">ASK GGHS · ZELKOVA<br><button class="admin-link" id="adminToggle">관리자 로그인</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Supabase 프로젝트 URL과 anon key를 아래에 입력하세요. 이 키는 공개용 anon key이며 service_role 키는 절대 넣지 마세요. */
const SUPABASE_URL = "https://izjlfbpttyicblbsvzlq.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "sb_publishable_Jlx7dPzdqUwlgx6As8P0Jw_pnriLYmb";
const configured = SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20;
const db = configured && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let activeFilter = "전체", questions = [], currentUser = null;
const $ = id => document.getElementById(id);
function feedback(msg, error=false){$("feedback").textContent=msg;$("feedback").className="feedback show"+(error?" error":"");}
function safeDate(v){return v?new Date(v).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";}
function render(){
 const visible=questions.filter(q=>activeFilter==="전체"||q.category===activeFilter);
 $("count").textContent=`공개 질문 ${questions.length}개`;
 const list=$("questionList");list.innerHTML="";
 if(!visible.length){list.innerHTML='<div class="empty">아직 공개된 질문이 없습니다.</div>';return;}
 visible.forEach(q=>{
  const el=document.createElement("article");el.className="question";
  const top=document.createElement("div");top.className="qtop";
  const cat=document.createElement("span");cat.className="category";cat.textContent=q.category;
  const status=document.createElement("span");status.className="status"+(q.answer?" done":"");status.textContent=q.answer?"답변 완료":"답변 대기";
  top.append(cat,status);
  const title=document.createElement("h3");title.textContent=q.title;
  const meta=document.createElement("div");meta.className="meta";meta.textContent=safeDate(q.created_at);
  const body=document.createElement("div");body.className="qbody";body.textContent=q.body;
  const answer=document.createElement("div");answer.className="answer";answer.textContent=q.answer?"젤코바 답변\n"+q.answer:"젤코바 부원들이 확인 후 답변할 예정입니다.";
  el.append(top,title,meta,body,answer);el.addEventListener("click",()=>el.classList.toggle("open"));list.append(el);
 });
}
async function loadQuestions(){
 if(!db){$("count").textContent="연결 설정 필요";$("questionList").innerHTML='<div class="empty">아직 데이터베이스가 연결되지 않았어요. 아래 제작 안내에 따라 Supabase를 연결해 주세요.</div>';return;}
 const {data,error}=await db.from("questions").select("id,category,title,body,answer,created_at").eq("status","published").order("created_at",{ascending:false});
 if(error){$("questionList").innerHTML='<div class="empty">질문을 불러오지 못했어요. 관리자에게 문의해 주세요.</div>';console.error(error);return;}
 questions=data||[];render();
}
$("questionForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const title=$("title").value.trim(), body=$("body").value.trim(), category=$("category").value;
 if(!title||!body){feedback("질문 제목과 내용을 모두 입력해 주세요.",true);return;}
 if(!db){feedback("아직 공용 데이터베이스가 연결되지 않았어요. Supabase 설정을 먼저 완료해야 질문이 저장됩니다.",true);return;}
 $("submitBtn").disabled=true;$("submitBtn").textContent="등록 중…";
 const {error}=await db.from("questions").insert({category,title,body,status:"pending"});
 $("submitBtn").disabled=false;$("submitBtn").textContent="질문 등록하기";
 if(error){feedback("등록에 실패했어요. 잠시 후 다시 시도해 주세요.",true);console.error(error);return;}
 e.target.reset();feedback("질문이 접수됐어요! 젤코바 확인 후 공개 질문 목록에 표시됩니다.");
});
$("filters").addEventListener("click",e=>{const b=e.target.closest("button[data-filter]");if(!b)return;activeFilter=b.dataset.filter;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c===b));render();});
async function refreshAdmin(){
 const {data:auth}=await db.auth.getUser();currentUser=auth.user;
 const box=$("adminContent");
 if(!currentUser){box.innerHTML='<p>관리자 계정으로 로그인해 주세요.</p><input class="field" id="adminEmail" type="email" placeholder="이메일"><input class="field" id="adminPassword" type="password" placeholder="비밀번호" style="margin:8px 0"><button class="smallbtn" id="loginBtn">로그인</button>'; $("loginBtn").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$("adminEmail").value,password:$("adminPassword").value});if(error)alert("로그인에 실패했어요. 계정 정보를 확인해 주세요.");else refreshAdmin();};return;}
 const {data:admin}=await db.from("admin_users").select("user_id").eq("user_id",currentUser.id).maybeSingle();
 if(!admin){await db.auth.signOut();box.textContent="관리자 권한이 없는 계정입니다.";return;}
 box.innerHTML='<div class="admin-actions"><button class="smallbtn secondary" id="logoutBtn">로그아웃</button></div><p>접수된 질문을 확인하고 공개 여부와 답변을 관리하세요.</p><div id="pendingList">불러오는 중…</div>';
 $("logoutBtn").onclick=async()=>{await db.auth.signOut();refreshAdmin();};
 const {data,error}=await db.from("questions").select("*").order("created_at",{ascending:false});
 if(error){$("pendingList").textContent="질문을 불러오지 못했습니다.";return;}
 const target=$("pendingList");target.innerHTML="";
 if(!data.length){target.textContent="접수된 질문이 없습니다.";return;}
 data.forEach(q=>{
  const row=document.createElement("div");row.className="admin-row";
  const h=document.createElement("strong");h.textContent=`[${q.category}] ${q.title}`;
  const p=document.createElement("p");p.textContent=q.body;
  const ta=document.createElement("textarea");ta.className="field";ta.placeholder="답변을 작성해 주세요.";ta.value=q.answer||"";
  const actions=document.createElement("div");actions.className="admin-actions";
  const publish=document.createElement("button");publish.className="smallbtn";publish.textContent=q.status==="published"?"답변/내용 수정 후 저장":"답변 작성 및 공개";
  publish.onclick=async()=>{const {error}=await db.from("questions").update({answer:ta.value.trim(),status:"published"}).eq("id",q.id);if(error)alert("저장 실패: "+error.message);else{alert("저장했어요! 공개 목록에 반영됩니다.");refreshAdmin();loadQuestions();}};
  const hide=document.createElement("button");hide.className="smallbtn secondary";hide.textContent="비공개";hide.onclick=async()=>{const {error}=await db.from("questions").update({status:"pending"}).eq("id",q.id);if(error)alert(error.message);else refreshAdmin();};
  actions.append(publish,hide);row.append(h,p,ta,actions);target.append(row);
 });
}
$("adminToggle").onclick=()=>{if(!db){alert("Supabase 연결 설정을 먼저 완료해 주세요.");return;}$("adminPanel").classList.toggle("show");refreshAdmin();$("adminPanel").scrollIntoView({behavior:"smooth"});};
if(db){
 loadQuestions();
 db.channel("public-questions").on("postgres_changes",{event:"*",schema:"public",table:"questions"},()=>loadQuestions()).subscribe();
}else{
 $("count").textContent="연결 설정 필요";
 $("questionList").innerHTML='<div class="empty">공용 질문 목록을 사용하려면 Supabase 연결이 필요합니다.</div>';
}
</script>
</body></html>
